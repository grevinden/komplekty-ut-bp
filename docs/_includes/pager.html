<nav class="pager{% if include.bottom %} pager-bottom{% endif %}" aria-label="Навигация по книге">
  {% if page.prev_url %}<a class="prev" href="{{ page.prev_url | relative_url }}">← {{ page.prev_title }}</a>{% endif %}
  <a class="toc" href="{{ '/' | relative_url }}">Оглавление</a>
  {% if page.next_url %}<a class="next" href="{{ page.next_url | relative_url }}">{{ page.next_title }} →</a>{% endif %}
</nav>
