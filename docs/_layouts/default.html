<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    Собрано 31.10.2026 по текстам ИТС и открытому интернету ·
    метод и метки достоверности — на <a href="{{ '/' | relative_url }}">обложке</a>
  </footer>
  <script defer src="{{ '/assets/mermaid.min.js' | relative_url }}"></script>
  <script type="module">
    if (document.querySelector('code.language-mermaid')) {
      document.querySelectorAll('pre > code.language-mermaid').forEach(code => {
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code.textContent;
        code.parentElement.replaceWith(div);
      });
      mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' });
      await mermaid.run({ querySelector: '.mermaid' });
    }
  </script>
</body>
</html>
